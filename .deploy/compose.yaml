services:
  web:
    image: ${REGISTRY_URL}/${IMAGE_NAME}:${IMAGE_TAG}
    container_name: ${IMAGE_NAME}-${STAGE}
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${PG_DATABASE_URL}
      - PG_DATABASE_URL=${PG_DATABASE_URL}
      - MSSQL_DATABASE_URL=${MSSQL_DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_COOKIE_NAME=${AUTH_COOKIE_NAME:-wisecon_dashboard_session}
      - USE_SECURE_COOKIE=${USE_SECURE_COOKIE:-true}
      - NEXT_PUBLIC_LOGIN_URL=${NEXT_PUBLIC_LOGIN_URL:-/login}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
      - SKIP_AUTH=false
    networks:
      - stage-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-1.5}'
          memory: ${MEM_LIMIT:-1024M}

networks:
  stage-net:
    external: true
    name: ${STAGE}-net
